name: AI-BOM Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [ "**" ]

permissions:
  contents: read
  checks: read
  pull-requests: write
  statuses: read

env:
  # Common locations
  AIBOM_ROOT: AI-BOM
  AIBOM_SCHEMA: AI-BOM/schema/ai-bom.schema.json
  # Optional: public key for cosign verification (use repo/org secret)
  COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
  # Required status context (or Check Run name) that your TEVV pipeline publishes
  TEVV_REQUIRED_CHECK: TEVV

jobs:
  detect-changes:
    name: Detect AI-BOM changes
    runs-on: ubuntu-latest
    outputs:
      aibom_changed: ${{ steps.filter.outputs.aibom }}
      changed_files: ${{ steps.changed.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            aibom:
              - '${{ env.AIBOM_ROOT }}/**/ai-bom.json'
              - '${{ env.AIBOM_SCHEMA }}'

      - name: List changed files
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: |
            ${{ env.AIBOM_ROOT }}/**/ai-bom.json
            ${{ env.AIBOM_SCHEMA }}

      - name: Summary
        if: steps.filter.outputs.aibom == 'true'
        run: |
          echo "AI-BOM changes detected:"
          echo '${{ steps.changed.outputs.all_changed_files }}'

  validate-schema:
    name: Validate AI-BOM schema
    needs: detect-changes
    if: needs.detect-changes.outputs.aibom_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install ajv-cli
        run: |
          npm -g i ajv-cli@5

      - name: Validate JSON against schema
        run: |
          # Validate all changed ai-bom.json files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '${{ env.AIBOM_ROOT }}/**/ai-bom.json' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed ai-bom.json files to validate."
            exit 0
          fi
          echo "$CHANGED" | while read -r f; do
            echo "::group::Validating $f"
            ajv validate -s "${{ env.AIBOM_SCHEMA }}" -d "$f" --strict=false
            echo "::endgroup::"
          done

  check-required-fields:
    name: Field & evidence checks
    needs: [detect-changes, validate-schema]
    if: needs.detect-changes.outputs.aibom_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify required fields & non-empty values
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '${{ env.AIBOM_ROOT }}/**/ai-bom.json' || true)
          if [ -z "$CHANGED" ]; then
            exit 0
          fi

          missing=0
          for f in $CHANGED; do
            echo "::group::Checking $f"
            for key in id type name version; do
              v=$(jq -r --arg k "$key" '.[$k] // empty' "$f")
              if [ -z "$v" ] || [ "$v" = "null" ]; then
                echo "::error file=$f::Missing required field: $key"
                missing=1
              fi
            done

            # Owner roles for RBAC/SoD
            for path in '.owner.model_owner' '.owner.aims_admin'; do
              v=$(jq -r "$path // empty" "$f")
              if [ -z "$v" ] || [ "$v" = "null" ]; then
                echo "::error file=$f::Missing required value: $path"
                missing=1
              fi
            done

            # Provenance & TEVV references
            for path in '.provenance.source' '.provenance.hash' '.tevv.last_run' '.tevv.results_url'; do
              v=$(jq -r "$path // empty" "$f")
              if [ -z "$v" ] || [ "$v" = "null" ]; then
                echo "::error file=$f::Missing required value: $path"
                missing=1
              fi
            done

            # Security minimums (signatures + integrity)
            for path in '.security.signing_key' '.security.integrity_hash'; do
              v=$(jq -r "$path // empty" "$f")
              if [ -z "$v" ] || [ "$v" = "null" ]; then
                echo "::error file=$f::Missing security value: $path"
                missing=1
              fi
            done

            # Risk classification
            v=$(jq -r '.risk.risk_classification // empty' "$f")
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "::error file=$f::Missing risk.risk_classification"
              missing=1
            fi

            echo "::endgroup::"
          done

          if [ $missing -ne 0 ]; then
            echo "One or more AI-BOM files failed field checks."
            exit 1
          fi

  verify-signatures:
    name: Verify signatures (optional online check)
    needs: [detect-changes, validate-schema, check-required-fields]
    if: needs.detect-changes.outputs.aibom_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cosign
        if: env.COSIGN_PUBLIC_KEY != ''
        uses: sigstore/cosign-installer@v3

      - name: Check signatures are present (metadata)
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '${{ env.AIBOM_ROOT }}/**/ai-bom.json' || true)
          if [ -z "$CHANGED" ]; then exit 0; fi
          missing=0
          for f in $CHANGED; do
            count=$(jq '.signatures | length' "$f")
            if [ "$count" -lt 1 ]; then
              echo "::error file=$f::No signatures[] found"
              missing=1
            fi
          done
          [ $missing -eq 0 ]

      - name: Verify cosign signature(s) with supplied public key
        if: env.COSIGN_PUBLIC_KEY != ''
        run: |
          # Example: if your AI-BOM 'download_url' references OCI or file artifacts with annotations.
          # Replace the next lines to your verification pattern as needed.
          echo "Perform cosign verify steps here using COSIGN_PUBLIC_KEY..."
          echo "Skipping concrete verification because artifact URIs are organization-specific."
          # Example command:
          # cosign verify --key <(echo "$COSIGN_PUBLIC_KEY") <OCI-IMAGE-OR-ATTESTATION-REF>
          exit 0

  tevvgate:
    name: Require TEVV check passed
    needs: [detect-changes, validate-schema, check-required-fields]
    if: needs.detect-changes.outputs.aibom_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure TEVV check or status is successful on HEAD
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const requiredName = process.env.TEVV_REQUIRED_CHECK;

            // 1) Check Runs API
            const checks = await github.rest.checks.listForRef({ owner, repo, ref });
            const okCheck = checks.data.check_runs.find(cr =>
              (cr.name || '').toLowerCase().includes(requiredName.toLowerCase()) &&
              cr.conclusion === 'success'
            );

            // 2) Fallback: Statuses API
            const statuses = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
            const okStatus = statuses.data.statuses.find(st =>
              (st.context || '').toLowerCase().includes(requiredName.toLowerCase()) &&
              st.state === 'success'
            );

            if (!okCheck && !okStatus) {
              core.setFailed(`Required TEVV check/status "${requiredName}" not successful on ${ref}.`);
            }

  approvals:
    name: Approvals & SoD
    needs: [detect-changes, validate-schema, check-required-fields, tevvgate]
    if: needs.detect-changes.outputs.aibom_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load role approvers map
        id: load
        shell: bash
        run: |
          if [[ -f ".github/role-approvers.yml" ]]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate approvals per role & enforce SoD
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Load role approvers from YAML file if present
            const fs = require('fs');
            const yamlPath = '.github/role-approvers.yml';
            let roles = { aims_admins: [], model_owners: [] };
            if (fs.existsSync(yamlPath)) {
              const yaml = require('js-yaml');
              const doc = yaml.load(fs.readFileSync(yamlPath, 'utf8'));
              roles.aims_admins = Array.isArray(doc?.aims_admins) ? doc.aims_admins : [];
              roles.model_owners = Array.isArray(doc?.model_owners) ? doc.model_owners : [];
            } else {
              core.info('role-approvers.yml not found, falling back to PR description tags');
            }

            // Gather reviews
            const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number: prNumber });
            const approvals = reviews
              .filter(r => r.state === 'APPROVED')
              .reduce((acc, r) => { acc[r.user.login.toLowerCase()] = r; return acc; }, {});

            const author = context.payload.pull_request.user.login.toLowerCase();

            function hasApprovalFrom(list) {
              return list.some(u => approvals[u.toLowerCase()]);
            }
            function notAuthor(list) {
              return list.some(u => u.toLowerCase() !== author && approvals[u.toLowerCase()]);
            }

            let aimsOk = false, modelOk = false, sodOk = true;
            if (roles.aims_admins.length > 0 || roles.model_owners.length > 0) {
              aimsOk = hasApprovalFrom(roles.aims_admins);
              modelOk = hasApprovalFrom(roles.model_owners);
              // SoD: ensure approver != author for both roles
              const aimsSod = notAuthor(roles.aims_admins);
              const modelSod = notAuthor(roles.model_owners);
              sodOk = aimsSod && modelSod;
            } else {
              // Fallback: parse required tags from PR body (e.g., @aims-admin: user1, @model-owner: user2 approved)
              const body = context.payload.pull_request.body || '';
              aimsOk = /approved-by:\s*aims_admin/i.test(body);
              modelOk = /approved-by:\s*model_owner/i.test(body);
              sodOk = !body.toLowerCase().includes(`approved-by:.*${author}`);
            }

            let errors = [];
            if (!aimsOk) errors.push('Missing approval from **AIMS_Admin** role.');
            if (!modelOk) errors.push('Missing approval from **Model_Owner** role.');
            if (!sodOk) errors.push('Separation of Duties violated (author cannot be an approver).');

            if (errors.length) {
              core.setFailed(errors.join(' '));
            } else {
              core.info('Approvals & SoD checks passed.');
            }

      - name: Comment PR summary
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **AI-BOM Governance Status**
            - Schema validation: ${{ job.status == 'success' && '✅' || '❌' }}
            - Field/evidence checks: see job logs
            - TEVV gate: required check `${{ env.TEVV_REQUIRED_CHECK }}`
            - Approvals & SoD: enforced
            - Signatures: metadata required; optional cosign verify if key provided

  merge-blocker:
    name: Fail PR if any job failed
    needs: [validate-schema, check-required-fields, verify-signatures, tevvgate, approvals]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job outcomes
        run: |
          set -e
          statuses="${{ needs.validate-schema.result }} ${{ needs.check-required-fields.result }} ${{ needs.verify-signatures.result }} ${{ needs.tevvgate.result }} ${{ needs.approvals.result }}"
          echo "Job results: $statuses"
          if echo "$statuses" | grep -qiE "(failure|cancelled)"; then
            echo "One or more governance checks failed."
            exit 1
          fi
          echo "All governance checks passed."
